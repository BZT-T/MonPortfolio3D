<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio 3D - Planète Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main-view">
        <!-- Étoiles de fond -->
        <div class="stars" id="stars"></div>

        <!-- Canvas Three.js -->
        <div id="canvas-container"></div>

        <!-- Interface overlay -->
        <div class="ui-overlay">
            <div class="title">
                <h1>Portfolio</h1>
                <p>Explorez mon univers</p>
            </div>

            <div class="instructions">
                Cliquez sur les îles pour découvrir mon parcours
            </div>
        </div>

        <!-- Labels des îles -->
        <div id="island-labels"></div>
    </div>
    <div id="info-panel" class="info-panel">
        <button class="close-panel-btn" onclick="closePanel()">&times;</button>
        <div class="panel-header">
            <span id="panel-icon" class="panel-icon"></span>
            <h2 id="panel-title">Titre</h2>
        </div>
        <div id="panel-content" class="panel-content">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="js/ui.js"></script>
    <script src="js/planet.js"></script>
    <script src="js/main.js"></script>

    <template id="tpl-presentation">
        <div class="info-wrapper">
            <section class="info-section intro">
                <div class="section-tag">Qui je suis</div>
                <p>
                    Bonjour, moi c'est <strong>Yassine</strong> ! Mon aventure dans l'informatique a commencé au lycée,
                    mais c’est sur le terrain, en entreprise, que j’ai vraiment eu le déclic.
                    Ce que j'aime par-dessus tout, c'est créer des outils qui <strong>simplifient la vie</strong> des
                    utilisateurs.
                </p>
            </section>

            <section class="info-section path">
                <div class="section-tag">Parcours scolaire</div>
                <div class="path-item">
                    <span class="year">BUT</span>
                    <p>Informatique à l'IUT de Montpellier.</p>
                </div>
                <div class="path-item">
                    <span class="year">MASTER</span>
                    <p>ILSEN (Ingénierie du Logiciel de la Société Numérique) au CERI à Avignon.</p>
                </div>
                <div class="path-item highlight">
                    <span class="year">GENLOG</span>
                    <p>3 ans d'alternance : développement d'une application CRM sur Windows et d'un site internet type
                        coffre fort numérique.</p>
                </div>
            </section>

            <section class="info-section profile">
                <div class="section-tag">Mon profil</div>
                <p>
                    Je suis quelqu'un de <strong>créatif</strong> et très <strong>curieux</strong>. J'aime comprendre le
                    "pourquoi"
                    en posant des questions, ce qui m'aide à m'adapter vite et à prendre des responsabilités.
                </p>
                <p class="objective">
                    Mon objectif : Créer des logiciels qui font progresser notre société !
                </p>
            </section>

            <div class="cv-discovery">
                <span class="icon">🛰️</span>
                <p>Note : Mon CV s'est sûrement perdu sur le satellite... À vous de le retrouver !</p>
            </div>
        </div>
    </template>

    <template id="tpl-projets">
        <div class="info-wrapper">
            <h2 class="section-main-title">Réalisations</h2>

            <article class="project-card">
                <div class="project-category">PROJET PERSO</div>
                <div class="project-carousel">
                    <div class="carousel-track">
                        <img src="img/fisabilillah1.png" class="carousel-img active">
                        <img src="img/fisabilillah2.png" class="carousel-img">
                        <img src="img/fisabilillah3.png" class="carousel-img">
                    </div>

                    <button class="carousel-btn prev" onclick="moveCarousel(this, -1)">&#10094;</button>
                    <button class="carousel-btn next" onclick="moveCarousel(this, 1)">&#10095;</button>

                    <div class="carousel-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <div class="project-info">
                    <h3>Fisabilillah</h3>
                    <p>Application de gestion pour association : suivi pédagogique des élèves, annuaire parents et
                        outils de gestion financière (collectes & dépenses).</p>
                    <div class="tech-stack">
                        <span class="tech">WLangage</span>
                        <span class="tech">MySQL</span>
                    </div>
                </div>
            </article>

            <article class="project-card">
                <div class="project-category">SCOLAIRE (BUT 3)</div>
                <div class="project-carousel">
                    <div class="carousel-track">
                        <img src="img/save1.png" class="carousel-img active">
                        <img src="img/save2.png" class="carousel-img">
                    </div>

                    <button class="carousel-btn prev" onclick="moveCarousel(this, -1)">&#10094;</button>
                    <button class="carousel-btn next" onclick="moveCarousel(this, 1)">&#10095;</button>

                    <div class="carousel-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <div class="project-info">
                    <h3>Backup System</h3>
                    <p>Solution client-serveur de sauvegarde à distance. Inclut un système de logs en temps réel et un
                        versionning sécurisé des fichiers.</p>
                    <div class="tech-stack">
                        <span class="tech">WLangage</span>
                        <span class="tech">MySQL</span>
                    </div>
                </div>
            </article>

            <article class="project-card">
                <div class="project-category">SCOLAIRE (BUT 2)</div>
                <div class="project-carousel">
                    <div class="carousel-track">
                        <img src="img/eVote1.png" class="carousel-img active">
                        <img src="img/eVote2.png" class="carousel-img">
                    </div>

                    <button class="carousel-btn prev" onclick="moveCarousel(this, -1)">&#10094;</button>
                    <button class="carousel-btn next" onclick="moveCarousel(this, 1)">&#10095;</button>

                    <div class="carousel-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <div class="project-info">
                    <h3>E-Vote Solutions</h3>
                    <p>Application de vote électronique sécurisée pour entreprises, facilitant les prises de décision
                        collaboratives en interne.</p>
                    <div class="tech-stack">
                        <span class="tech">Java</span>
                        <span class="tech">JavaFX</span>
                        <span class="tech">MySQL</span>
                    </div>
                </div>
            </article>
        </div>
    </template>
    
    <template id="tpl-competences">
        <div class="info-wrapper">
            <h2 class="section-main-title">Expertise Système</h2>

            <section class="skills-universe">
                <div class="section-tag">ORBITAL_SKILLS</div>
                <div class="skills-grid">
                    <div class="skill-planet level-5" data-name="WinDev"></div>
                    <div class="skill-planet level-5" data-name="SQL"></div>
                    <div class="skill-planet level-4" data-name="Java"></div>
                    
                    <div class="skill-planet level-3" data-name="JavaScript"></div>
                    <div class="skill-planet level-3" data-name="Vue.js"></div>
                    <div class="skill-planet level-3" data-name="NodeJS"></div>
                    <div class="skill-planet level-3" data-name="Docker"></div>
                    <div class="skill-planet level-3" data-name="TypeScript"></div>
                    
                    <div class="skill-planet level-2" data-name="Spring"></div>
                    <div class="skill-planet level-2" data-name="Rust"></div>
                    <div class="skill-planet level-2" data-name="Python"></div>
                    <div class="skill-planet level-2" data-name="Kali"></div>
                </div>
                <p class="skills-legend">La taille des astres indique le niveau de maîtrise technique.</p>
            </section>

            <section class="soft-skills-container">
                <div class="section-tag">CORE_VALUES</div>
                <div class="constellation-view">
                    <div class="soft-node">Travail d'équipe</div>
                    <div class="soft-node">Autonome</div>
                    <div class="soft-node">Rigoureux</div>
                    <div class="soft-node">Créatif</div>
                    <div class="soft-node">Responsable</div>
                    <div class="soft-node">Méthodique</div>
                </div>
            </section>
        </div>
    </template>

    <template id="tpl-contact">
        <div class="info-wrapper">
            <h2 class="section-main-title">Canal de Transmission</h2>

            <section class="info-section">
                <div class="section-tag">COMM_LINK_STATUS: READY</div>
                <p>Une opportunité, une question technique ou simplement envie d'échanger sur un projet ? Le canal est ouvert.</p>
                
                <div class="contact-grid">
                    <a href="https://fr.linkedin.com/in/yassine-bouazzati-182427230" target="_blank" class="contact-card">
                        <span class="contact-icon">🔗</span>
                        <div class="contact-text">
                            <span class="label">LINKEDIN</span>
                            <span class="value">Yassine BOUAZZATI</span>
                        </div>
                    </a>

                    <a href="mailto:yassinebouazzati2@gmail.com" class="contact-card">
                        <span class="contact-icon">📧</span>
                        <div class="contact-text">
                            <span class="label">EMAIL</span>
                            <span class="value">Cliquez pour envoyer</span>
                        </div>
                    </a>
                </div>
            </section>

            <section class="info-section download-zone">
                <div class="section-tag">SATELLITE_DATA_RECOVERY</div>
                <p>Félicitations, vous avez localisé le satellite !</p>
                <a href="https://drive.google.com/file/d/1sj1EnZGq9PR7_YTbJxMYUtlZXBT_eama/view?usp=sharing" target="_blank" class="download-btn">
                    CONSULTER MON CV (PDF)
                </a>
            </section>
        </div>
    </template>

    <div id="lightbox" class="lightbox">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>

        <button class="lb-btn prev" onclick="changeLightboxImage(-1)">&#10094;</button>

        <div class="lb-content">
            <img id="lightbox-img" src="" alt="Aperçu grand format">
        </div>

        <button class="lb-btn next" onclick="changeLightboxImage(1)">&#10095;</button>
    </div>
</body>

</html>
